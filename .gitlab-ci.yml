workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore: release/'
      variables:
        RELEASE_COMMIT: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build-images
  - check
  - test
  - build
  - release

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  GIT_DEPTH: 20
  RELEASE_PLZ_VERSION: "0.3.160"
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_NET_RETRY: "5"
  FF_USE_FASTZIP: "1"
  CACHE_COMPRESSION_LEVEL: "fastest"
  CI_RUST_IMAGE: "${CI_REGISTRY_IMAGE}/ci-rust:rust-1.91.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: "${CI_PROJECT_DIR}/.sccache"
  SCCACHE_CACHE_SIZE: "1G"

.rust-cache-debug: &rust-cache-debug
  cache:
    key: rust-debug-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-debug-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - .sccache/

.rust-cache-release: &rust-cache-release
  cache:
    key: rust-release-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-release-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - .sccache/

.install-release-plz: &install-release-plz
  - mkdir -p "${CI_PROJECT_DIR}/.cargo/bin"
  - curl -sSfL "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "${CI_PROJECT_DIR}/.cargo/bin" release-plz
  - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  - release-plz --version

# Validation jobs run only on MR pipelines.
# Code is already validated before reaching main.
# Release MRs from release-plz only bump Cargo.toml + CHANGELOG -- skip validation.
.only-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# BUILD IMAGES
# ---------------------------------------------------------------------------

build-ci-images:
  stage: build-images
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/ci/rust"
      --dockerfile "${CI_PROJECT_DIR}/ci/rust/Dockerfile"
      --destination "$CI_RUST_IMAGE"
  rules:
    - changes:
        - ci/rust/Dockerfile
    - if: $BUILD_CI_IMAGES == "true"

# ---------------------------------------------------------------------------
# CHECK
# ---------------------------------------------------------------------------

cargo-fmt:
  extends: .only-mr
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo fmt --all -- --check

cargo-clippy:
  extends: .only-mr
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

cargo-audit:
  extends: .only-mr
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  script:
    - cargo audit
  allow_failure: false

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

unit-tests:
  extends: .only-mr
  stage: test
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo nextest run --workspace

doc-tests:
  extends: .only-mr
  stage: test
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --doc

coverage:
  extends: .only-mr
  stage: test
  image: $CI_RUST_IMAGE
  <<: *rust-cache-debug
  needs: []
  script:
    - cargo llvm-cov nextest --workspace --exclude mailcraft-derive --cobertura --output-path coverage.xml
  coverage: '/TOTAL.*\s(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------

build-release:
  stage: build
  image: $CI_RUST_IMAGE
  <<: *rust-cache-release
  script:
    - cargo build --workspace --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

# ---------------------------------------------------------------------------
# RELEASE
# ---------------------------------------------------------------------------

release-plz-update:
  stage: release
  image: rust:1.91.0
  <<: *rust-cache-release
  needs:
    - build-release
  variables:
    GIT_DEPTH: 0
    RUSTC_WRAPPER: ""
  before_script:
    - *install-release-plz
  script:
    - git config user.name "release-plz[bot]"
    - git config user.email "release-plz@users.noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release-pr --forge gitlab --git-token "$GITLAB_TOKEN"
    - |
      MR_IID=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests?state=opened&search=release-plz&in=source_branch&per_page=1" \
        | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['iid'] if mrs else '')")
      if [ -n "$MR_IID" ]; then
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -s --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
            --data "merge_when_pipeline_succeeds=true")
          echo "$RESP"
          echo "$RESP" | grep -q '"merge_when_pipeline_succeeds":true' && break
          sleep 10
        done
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

release-plz-release:
  stage: release
  image: rust:1.91.0
  <<: *rust-cache-release
  needs:
    - job: build-release
      optional: true
  variables:
    GIT_DEPTH: 0
    RUSTC_WRAPPER: ""
  before_script:
    - *install-release-plz
  script:
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release --forge gitlab --git-token "$GITLAB_TOKEN"
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
